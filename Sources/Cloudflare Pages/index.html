*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI','Microsoft YaHei',sans-serif}body{background-color:#0078D4;background-image:linear-gradient(45deg,rgba(255,255,255,.05)25%,transparent 25%),linear-gradient(-45deg,rgba(255,255,255,.05)25%,transparent 25%),linear-gradient(45deg,transparent 75%,rgba(255,255,255,.05)75%),linear-gradient(-45deg,transparent 75%,rgba(255,255,255,.05)75%);background-size:40px 40px;background-position:0 0,0 20px,20px -20px,-20px 0;color:#333;min-height:100vh;display:flex;justify-content:center;align-items:center;position:relative;overflow:hidden}.desktop-wallpaper{position:fixed;top:0;left:0;width:100%;height:100%;background:linear-gradient(135deg,#0078D4 0%,#1E4FA0 50%,#002050 100%);z-index:-2}.taskbar{position:fixed;bottom:0;left:0;width:100%;height:48px;background-color:rgba(32,32,32,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:1000;border-top:1px solid rgba(255,255,255,.1);transition:opacity .3s ease}.taskbar.hidden{opacity:0;pointer-events:none}.windows-logo{width:24px;height:24px}.time-display{color:#fff;font-size:12px;padding:8px 12px}.window-container{width:900px;height:550px;background-color:#fafafa;border-radius:8px;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.15);display:flex;flex-direction:column;border:1px solid #e1e1e1;position:absolute;z-index:2}.title-bar{height:32px;background-color:#f3f3f3;display:flex;align-items:center;justify-content:space-between;padding:0 8px;user-select:none;border-bottom:1px solid #e1e1e1;-webkit-app-region:drag}.title-bar-drag{-webkit-app-region:drag;flex:1;height:100%;display:flex;align-items:center;padding-left:12px}.window-title{font-size:12px;font-weight:500;color:#333}.window-controls{display:flex;gap:2px;-webkit-app-region:no-drag}.window-btn{width:46px;height:32px;border:none;background:transparent;color:#333;font-size:10px;display:flex;align-items:center;justify-con <body>
<div class="desktop-wallpaper"></div>
<div class="desktop-icon" id="githubIcon" title="项目仓库"><div class="desktop-icon-img"><svg viewBox="0 0 24 24"><path d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z"/></svg></div><div class="desktop-icon-text">项目仓库</div></div>

<div class="window-container" id="windowContainer">

                <path d="M15 12 h2 v8 h-2 Z M15 22 h2 v2 h-2 Z" fill="#333"/>
            </svg>

    </div>
</div>
<script>
const $=(i)=>document.getElementById(i),ui=$('urlInput'),pb=$('parseBtn'),db=$('downloadBtn'),cb=$('clearBtn'),rt=$('resultText'),wc=$('windowContainer'),mb=$('maximizeBtn'),clb=$('closeBtn'),td=$('timeDisplay'),tb=$('taskbar'),gi=$('githubIcon'),ov=$('modalOverlay'),mm=$('modalMsg'),wd=$('winDialog'),mh=$('modalHeader'),mi=$('modalIcon');let isM=!1,oP={x:0,y:0},oS={w:900,h:550},isD=!1,dX,dY,cX,cY,ck="",isMD=!1,mDX,mDY,mCX,mCY,isP=!1,dragTarget=null;const winAlert=(m,inf=!1)=>{mm.textContent=m;ov.style.display='flex';wd.style.visibility='hidden';const s=mh.querySelector('span');if(inf){if(mi)mi.style.display='none';s.textContent='提示：'}else{if(mi)mi.style.display='block';s.textContent='警告：'}setTimeout(()=>{const r=wd.getBoundingClientRect(),x=(window.innerWidth-r.width)/2,y=(window.innerHeight-r.height)/2;Object.assign(wd.style,{left:x+"px",top:y+"px",visibility:'visible'});$('modalOk').focus()},0)};window.closeWinModal=()=>{ov.style.display='none'};const ut=()=>{const e=new Date;td.textContent=e.getHours().toString().padStart(2,"0")+":"+e.getMinutes().toString().padStart(2,"0")};async function pl(){if(isP){winAlert("正在努力解析中，请稍候...",!0);return}console.log("正在分析Url...");const e=ui.value.trim(),l=e.toLowerCase();if(!e||!(l.startsWith("http://")||l.startsWith("https://"))){console.error("解析失败: 无效的URL地址");rt.value="解析失败: 无效的URL地址";return}isP=!0;rt.value="正在分析Url...";ck="";try{const r=await fetch('/parse',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url:e})}),d=await r.json();if(!r.ok){const m=d?.error??"解析失败: 未知错误";console.error(m);rt.value=m}else{const s=d.result||"",t=s.toLowerCase();if(t.startsWith("http://")||t.startsWith("https://")){console.log("解析完成");rt.value=s;if(d.cookie)ck=d.cookie;if(window.setParseLogs&&Array.isArray(d.logs))window.setParseLogs(d.logs)}else{console.error(s);rt.value=s;if(window.setParseLogs&&Array.isArray(d.logs))window.setParseLogs(d.logs)}}}catch(n){console.error("解析失败：/parse 接口无响应",n);rt.value="解析失败：/parse 接口无响应"}finally{isP=!1}}db.onclick=()=>{const v=rt.value.trim(),l=v.toLowerCase();if(!v){winAlert("请先点击【开始解析】按钮获取下载地址",!1);return}if(!(l.startsWith("http://")||l.startsWith("https://"))){winAlert("解析结果不是有效的下载地址",!1);return}let f=crypto.randomUUID().replace(/-/g,'');try{const p=new URLSearchParams(v.split('?')[1]);const fn=p.get('fileName')||p.get('fname');if(fn)f=fn}catch(e){}let cmd='curl -sL "'+v+'"';if(ck&&ck.trim()!==""){cmd+=' -H "Cookie: '+ck+'"'}cmd+=' -o "'+f+'"';winAlert(cmd,!0)};cb.onclick=()=>{console.log("已清空所有内容");ui.value="";rt.value="";ck="";ui.focus()};mb.onclick=()=>{if(window.innerWidth>920)if(isM){tb.classList.remove("hidden");Object.assign(wc.style,{width:oS.w+"px",height:oS.h+"px",borderRadius:"8px",top:oP.y+"px",left:oP.x+"px",zIndex:"2"});isM=!1}else{oP={x:wc.offsetLeft,y:wc.offsetTop};oS={w:wc.offsetWidth,h:wc.offsetHeight};tb.classList.add("hidden");Object.assign(wc.style,{width:"100vw",height:"100vh",borderRadius:"0",top:"0",left:"0",position:"fixed",zIndex:"3"});isM=!0}};const sd=(e)=>{if(window.innerWidth<=920)return;dragTarget=e.currentTarget.closest('.window-container');if(!dragTarget)return;isD=!0;dX=e.clientX;dY=e.clientY;const o=dragTarget.getBoundingClientRect();cX=o.left;cY=o.top;document.addEventListener("mousemove",dd);document.addEventListener("mouseup",std)};const dd=(e)=>{if(!isD||!dragTarget)return;dragTarget.style.left=cX+(e.clientX-dX)+"px";dragTarget.style.top=cY+(e.clientY-dY)+"px"};const std=()=>{isD=!1;dragTarget=null;document.removeEventListener("mousemove",dd);document.removeEventListener("mouseup",std)};const smd=(e)=>{isMD=!0;mDX=e.clientX;mDY=e.clientY;const o=wd.getBoundingClientRect();mCX=o.left;mCY=o.top;document.addEventListener("mousemove",mmd);document.addEventListener("mouseup",stmd)};const mmd=(e)=>{if(isMD){wd.style.left=mCX+(e.clientX-mDX)+"px";wd.style.top=mCY+(e.clientY-mDY)+"px"}};const stmd=()=>{isMD=!1;document.removeEventListener("mousemove",mmd);document.removeEventListener("mouseup",stmd)};const cw=()=>{if(!isM&&window.innerWidth>920){const x=(window.innerWidth-900)/2,y=(window.innerHeight-550)/2;Object.assign(wc.style,{left:x+"px",top:y+"px",position:"fixed"});oP={x,y}}};window.onload=()=>{cw();ut();setInterval(ut,1e3)};pb.onclick=pl;ui.onfocus=()=>ui.parentElement.style.borderColor="#0078D4";ui.onblur=()=>ui.parentElement.style.borderColor="#E8E8E8";ui.onkeypress=e=>{"Enter"===e.key&&pl()};clb.onclick=()=>{window.innerWidth>920&&window.close()};document.querySelectorAll(".title-bar-drag").forEach(el=>el.onmousedown=sd);mh.onmousedown=smd;gi.onclick=()=>{window.open("https://github.com/05740682/LinkSimplifier","_blank")};const logIcon=$('logIcon'),logWin=$('logWindow'),logClose=$('logCloseBtn');logIcon.onclick=()=>{logWin.style.display='flex';logWin.style.left=(window.innerWidth-720)/2+'px';logWin.style.top=(window.innerHeight-420)/2+'px'};logClose.onclick=()=>{logWin.style.display='none'};window.setParseLogs=function(logs){const box=$('logViewer');box.value=Array.isArray(logs)?logs.join('\n'):'（无日志）';box.scrollTop=box.scrollHeight};
